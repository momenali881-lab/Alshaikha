name: Validate Alshaikha apps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze client app
        working-directory: client_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Analyze admin app
        working-directory: admin_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
