name: Build Android APKs
# Build includes the in-app back-navigation and usage-guide changes.
# Rebuild after the client navigation-key and PopScope closure fixes.

on:
  workflow_dispatch:
  push:
    branches: [main, notifications-bookings-polish, feature/back-navigation-user-guide]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep one signing identity across builds so installed apps can be updated safely.
      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: alshaikha-android-debug-signing-v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # The original launcher artwork is stored in assets/launcher_icon.jpg.
      # Both apps use this exact repository image; no external image URL is fetched.
      - name: Install image tooling
        run: python3 -m pip install --break-system-packages pillow
      - name: Generate Android projects
        run: |
          cd admin_app && flutter create --platforms=android . && cd ..
          cd client_app && flutter create --platforms=android . && cd ..
          python3 scripts/prepare_android.py
      - name: Build administration APK
        working-directory: admin_app
        run: flutter pub get && flutter build apk --release
      - name: Build client APK
        working-directory: client_app
        run: flutter pub get && flutter build apk --release
      - name: Upload administration APK
        uses: actions/upload-artifact@v4
        with:
          name: admin_app-apk
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload client APK
        uses: actions/upload-artifact@v4
        with:
          name: client_app-apk
          path: client_app/build/app/outputs/flutter-apk/app-release.apk
