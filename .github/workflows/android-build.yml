# Native launch artwork is generated from the shared intro asset before both APK builds.
name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches: [main, notifications-bookings-polish, feature/notifications-speed-display-2026-11-25, feature/client-member-card-compact-frame, feature/client-chat-header-back-guide, feature/client-home-header-price-filters, feature/admin-bottom-nav-chat-back, feature/animated-intro-client-admin, feature/member-voice-fingerprint]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Restore the exact existing Android debug signing identity from repository secrets.
      # This keeps both APKs signed with the same key without relying on an expiring Actions cache.
      - name: Restore permanent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -storetype JKS \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/signing-certificate.txt"
          grep -Fq 'B2:0A:4E:CB:E1:83:DD:95:67:BF:04:29:1E:62:BC:5D:53:84:DC:78' "$RUNNER_TEMP/signing-certificate.txt"
          echo "Verified expected Android signing certificate."
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # The original launcher artwork is stored in assets/launcher_icon.jpg.
      # Both apps use this exact repository image; no external image URL is fetched.
      - name: Install image tooling
        run: python3 -m pip install --break-system-packages pillow
      - name: Generate Android projects
        run: |
          cd admin_app && flutter create --platforms=android . && cd ..
          cd client_app && flutter create --platforms=android . && cd ..
          python3 scripts/prepare_android.py
      - name: Build administration APK
        working-directory: admin_app
        run: flutter pub get && flutter build apk --release --dart-define=ALSHAIKHA_NOTIFICATION_WEBHOOK_URL=${{ secrets.ALSHAIKHA_NOTIFICATION_WEBHOOK_URL }}
      - name: Build client APK
        working-directory: client_app
        run: flutter pub get && flutter build apk --release --dart-define=ALSHAIKHA_NOTIFICATION_WEBHOOK_URL=${{ secrets.ALSHAIKHA_NOTIFICATION_WEBHOOK_URL }}
      - name: Upload administration APK
        uses: actions/upload-artifact@v4
        with:
          name: admin_app-apk
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload client APK
        uses: actions/upload-artifact@v4
        with:
          name: client_app-apk
          path: client_app/build/app/outputs/flutter-apk/app-release.apk
