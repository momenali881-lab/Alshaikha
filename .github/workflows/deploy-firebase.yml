name: Deploy Firestore Rules (Firebase Spark)

on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: "Type alshaikha to confirm the Firebase project"
        required: true
        type: string

jobs:
  deploy:
    if: ${{ inputs.confirm_project == 'alshaikha' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore security rules only
        run: firebase deploy --only firestore:rules --project alshaikha --non-interactive
