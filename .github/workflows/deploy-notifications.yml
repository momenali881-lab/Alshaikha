name: Deploy notification delivery (Firebase Blaze)

on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: "Type alshaikha to confirm the Firebase project"
        required: true
        type: string

jobs:
  deploy:
    if: \${{ inputs.confirm_project == 'alshaikha' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: \${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Install function dependencies
        working-directory: functions
        run: npm install
      - name: Deploy notification function
        run: firebase deploy --only functions:deliverAppNotification --project alshaikha --non-interactive
